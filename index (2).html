<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snail Sprint – Typing Games Free</title>
<style>
html,body{margin:0;height:100%;background:#1b2a1f;display:flex;align-items:center;justify-content:center}
canvas{width:960px;height:540px;max-width:100vw;max-height:100vh;aspect-ratio:960/540;border-radius:8px;box-shadow:0 8px 30px #0008;display:block}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
const W=960,H=540,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const F='"Trebuchet MS","Comic Sans MS",Arial,sans-serif';
const RAW={
1:"cat:a pet that purrs,dog:a pet that barks,sun:it shines in the sky,hat:you wear it on your head,pen:you write with it,bus:a big vehicle for many people,egg:a hen lays it,cup:you drink from it,red:the color of a ripe tomato,box:a container with a lid,map:it shows where places are,bed:you sleep on it,pig:a farm animal that oinks,cow:it gives us milk,sky:above the clouds",
2:"fish:it swims in water,bird:it flies and sings,book:you read it,tree:it has leaves and branches,milk:a white drink,rain:water falling from clouds,star:it twinkles at night,moon:it glows at night,door:you open it to go in,farm:where animals and crops live,duck:a bird that quacks,frog:a green jumper that croaks,cake:a sweet treat for birthdays,ball:round and fun to kick,hand:it has five fingers",
3:"apple:a round red fruit,house:a place where people live,water:you drink it every day,happy:feeling very glad,green:the color of grass,mouse:a tiny animal that squeaks,table:you eat dinner on it,plant:it grows from a seed,snail:a slow animal with a shell,smile:a happy face,cloud:white and fluffy in the sky,horse:an animal you can ride,bread:baked from flour,music:songs and melodies,light:it helps us see in the dark",
4:"garden:where flowers grow,flower:colorful and sweet smelling,school:where students learn,friend:someone you like to play with,yellow:the color of a banana,rabbit:a hopping animal with long ears,window:glass in a wall,pencil:you write and draw with it,orange:a juicy citrus fruit,sunset:when the sun goes down,butter:spread it on bread,family:parents and children,summer:the hottest season,monkey:it climbs trees and loves bananas",
5:"teacher:helps students learn,library:a place full of books,rainbow:colors after the rain,kitchen:where food is cooked,morning:the start of the day,chicken:a farm bird that lays eggs,holiday:a day off from school,bicycle:a ride with two wheels,elephant:a huge animal with a trunk,sandwich:filling between two slices of bread,computer:you type on it,mountain:a very tall hill"
};
const WORDS={};for(const k in RAW)WORDS[k]=RAW[k].split(',').map(s=>{const[a,b]=s.split(':');return{w:a,m:b}});
const TOTAL=40,X0=150,X1=830,LANES=[290,375,460];
let state='menu',lvl=1,startLvl=1,t=0,last=0,btns=[];
let G;
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function newGame(){
  const base=8+(lvl-1)*3;
  G={pos:0,ti:0,cur:null,queue:[],mist:0,time:0,typed:0,wig:0,wob:0,place:0,fin:0,endT:0,
     r:[{pos:0,cps:base*5/60*(1+Math.random()*.08),fin:0,jit:0},{pos:0,cps:base*5/60*(.82+Math.random()*.08),fin:0,jit:0}],px:0};
  nextWord();state='play';
}
function nextWord(){
  if(!G.queue.length)G.queue=[...WORDS[lvl]].sort(()=>Math.random()-.5);
  G.cur=G.queue.pop();G.ti=0;
}
function finishPlayer(){
  G.fin++;G.place=G.fin;G.pdone=true;
  finishRace();
}
function finishRace(){
  if(state!=='play')return;
  state='result';
  if(G.place<=2)G.next=Math.min(5,lvl+1);else G.next=Math.max(1,lvl-1);
  G.msg=G.place===1?'1st place! You are the champion!':G.place===2?'2nd place! Great job!':'3rd place. Keep practicing!';
}
function update(dt){
  if(state!=='play')return;
  G.time+=dt;G.wig=Math.max(0,G.wig-dt);
  G.r.forEach(r=>{
    if(r.fin)return;
    r.pos+=r.cps*dt*(1+Math.sin(G.time*1.7+r.cps*50)*.25);
    if(r.pos>=TOTAL){r.pos=TOTAL;G.fin++;r.fin=G.fin}
  });
  if(G.r[0].fin&&G.r[1].fin&&!G.pdone){G.place=3;finishRace()}
}
function key(k){
  if(state==='play'){
    if(!/^[a-z]$/.test(k))return;
    const ch=G.cur.w[G.ti];
    if(k===ch){
      G.ti++;G.typed++;G.pos++;
      if(G.pos>=TOTAL){finishPlayer();return}
      if(G.ti>=G.cur.w.length)nextWord();
    }else{G.mist++;G.wig=.3}
  }
}
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(state==='play')state='pause';else if(state==='pause')state='play';e.preventDefault();return}
  if(e.key==='Enter'||e.key===' '){
    if(state==='menu'){lvl=startLvl;newGame()}
    else if(state==='result'){lvl=G.next;newGame()}
    else if(state==='pause')state='play';
    e.preventDefault();return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  key(e.key.toLowerCase());
});
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
cv.addEventListener('click',e=>{const[x,y]=pt(e);for(const b of btns)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.f();break}});
cv.addEventListener('mousemove',e=>{const[x,y]=pt(e);cv.style.cursor=btns.some(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)?'pointer':'default'});
function button(x,y,w,h,label,f,col,sz){
  btns.push({x,y,w,h,f});
  ctx.fillStyle='#0003';rr(x+2,y+5,w,h,h/2);ctx.fill();
  ctx.fillStyle=col||'#ff8a1f';rr(x,y,w,h,h/2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold '+(sz||26)+'px '+F;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+h/2+2);
}
function snail(x,y,col,wig,name){
  ctx.save();ctx.translate(x+(wig?Math.sin(t*70)*4:0),y);
  ctx.fillStyle='#f6d9a0';ctx.beginPath();ctx.ellipse(0,0,36,10,0,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(34,-8,10,0,7);ctx.fill();
  ctx.strokeStyle='#e0b66f';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(34,-14);ctx.lineTo(32,-30);ctx.moveTo(40,-14);ctx.lineTo(45,-28);ctx.stroke();
  ctx.fillStyle='#fff';[[32,-31],[45,-29]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4.5,0,7);ctx.fill()});
  ctx.fillStyle='#222';[[33,-31],[46,-29]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],2,0,7);ctx.fill()});
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(-4,-20,23,0,7);ctx.fill();
  ctx.strokeStyle='#0004';ctx.lineWidth=3;ctx.beginPath();
  for(let a=0;a<9;a+=.2){const r=1+a*2.1;ctx.lineTo(-4+Math.cos(a)*r,-20+Math.sin(a)*r)}ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 15px '+F;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText(name,0,-52);
  ctx.restore();
}
function banner(){
  const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#1f8a4c');g.addColorStop(1,'#2fb36a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,56);
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(40,28,20,0,7);ctx.fill();
  ctx.fillStyle='#1b2a1f';ctx.font='bold 22px '+F;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⌨',40,29);
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 28px '+F;ctx.fillText('TYPING GAMES FREE',72,29);
  ctx.textAlign='right';ctx.font='16px '+F;ctx.fillText('Learn to type and have fun every day',W-24,29);
}
function bg(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fd3ff');g.addColorStop(.55,'#d8f3ff');g.addColorStop(.55,'#7bcf6a');g.addColorStop(1,'#4fa84a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff9';[[120,110,40],[420,90,34],[760,130,44]].forEach(c=>{ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,7);ctx.arc(c[0]+34,c[1]+6,c[2]*.8,0,7);ctx.arc(c[0]-34,c[1]+8,c[2]*.7,0,7);ctx.fill()});
}
function menu(){
  bg();banner();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#0003';ctx.font='bold 76px '+F;ctx.fillText('SNAIL SPRINT',W/2+3,143);
  ctx.fillStyle='#ff8a1f';ctx.fillText('SNAIL SPRINT',W/2,140);
  ctx.fillStyle='#1b3a22';ctx.font='bold 22px '+F;ctx.fillText('Type the words and win the race! • Grades 3–5',W/2,200);
  snail(300,300,'#e5533d',false,'Rival 1');snail(480,300,'#3d8ee5',Math.sin(t*3)>.8,'You');snail(660,300,'#9b59d0',false,'Rival 2');
  ctx.fillStyle='#1b3a22';ctx.font='bold 18px '+F;ctx.fillText('Choose a level:',W/2,352);
  for(let i=1;i<=5;i++)button(W/2-175+(i-1)*72,368,60,46,String(i),()=>startLvl=i,i===startLvl?'#ff8a1f':'#6a7a6e',24);
  button(W/2-110,430,220,64,'▶  PLAY',()=>{lvl=startLvl;newGame()},'#e5533d',32);
  ctx.fillStyle='#1b3a22';ctx.font='15px '+F;
  ctx.fillText('Type each letter of the word to move your snail • A wrong key only wiggles it • Esc: pause',W/2,516);
}
function play(){
  bg();banner();
  // lanes
  LANES.forEach((y,i)=>{ctx.fillStyle=i===1?'#8a5a2b':'#9b6a37';rr(X0-40,y-34,X1-X0+110,56,14);ctx.fill();ctx.fillStyle='#0002';ctx.fillRect(X0-30,y+13,X1-X0+90,3)});
  // flag
  ctx.fillStyle='#fff';for(let i=0;i<6;i++)for(let j=0;j<2;j++){ctx.fillStyle=(i+j)%2?'#222':'#fff';ctx.fillRect(X1+30+j*10,LANES[0]-34+i*0+ i*0,0,0)}
  ctx.fillStyle='#222';ctx.fillRect(X1+40,240,5,240);
  for(let i=0;i<8;i++)for(let j=0;j<2;j++){ctx.fillStyle=(i+j)%2?'#222':'#fff';ctx.fillRect(X1+45+j*14,240+i*14,14,14)}
  const px=p=>X0+(X1-X0)*p/TOTAL;
  G.px+=(G.pos-G.px)*.25;
  snail(px(G.r[0].pos),LANES[0],'#e5533d',false,'Rival 1');
  snail(px(G.px),LANES[1],'#3d8ee5',G.wig>0,'You');
  snail(px(G.r[1].pos),LANES[2],'#9b59d0',false,'Rival 2');
  // word panel
  ctx.fillStyle='#fffe';rr(180,76,600,128,22);ctx.fill();
  const w=G.cur.w;ctx.font='bold 72px '+F;
  const ls=w.split('').map(c=>ctx.measureText(c).width+4),tw=ls.reduce((a,b)=>a+b,0);
  let x=W/2-tw/2;ctx.textAlign='left';ctx.textBaseline='middle';
  for(let i=0;i<w.length;i++){
    ctx.fillStyle=i<G.ti?'#1fa855':i===G.ti?(G.wig>0?'#e5533d':'#ff8a1f'):'#44504a';
    ctx.fillText(w[i],x,132);
    if(i===G.ti){ctx.fillStyle='#ff8a1f';ctx.fillRect(x,164,ls[i]-4,5)}
    x+=ls[i];
  }
  ctx.textAlign='center';ctx.fillStyle='#4a5a50';ctx.font='22px '+F;ctx.fillText('Hint: '+G.cur.m,W/2,188);
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 16px '+F;
  ctx.fillText('Level '+lvl,20,500);
  ctx.fillText('Mistakes: '+G.mist,100,500);
  ctx.textAlign='right';ctx.fillText('Progress: '+G.pos+'/'+TOTAL,W-20,500);
  if(state==='pause'){
    ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 56px '+F;ctx.fillText('PAUSED',W/2,230);
    button(W/2-120,270,240,60,'Resume',()=>state='play','#1fa855',28);
    button(W/2-120,345,240,52,'Main menu',()=>state='menu','#6a7a6e',22);
  }
}
function result(){
  play();
  ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';rr(230,100,500,340,26);ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='middle';
  const col=['','#f2b400','#8a96a0','#c47a3a'][G.place];
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(W/2,170,42,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 46px '+F;ctx.fillText(G.place,W/2,172);
  ctx.fillStyle='#1b3a22';ctx.font='bold 26px '+F;ctx.fillText(G.msg,W/2,238);
  const acc=Math.round(100*G.typed/Math.max(1,G.typed+G.mist)),wpm=Math.round(G.typed/5/(G.time/60));
  ctx.font='20px '+F;ctx.fillText('Time: '+G.time.toFixed(1)+'s   •   Speed: '+wpm+' WPM   •   Accuracy: '+acc+'%',W/2,278);
  ctx.fillStyle='#4a5a50';ctx.font='18px '+F;
  ctx.fillText(G.next>lvl?'Next level: '+G.next+' (harder)':G.next<lvl?'Next level: '+G.next+' (easier)':'Next level: '+G.next,W/2,310);
  button(W/2-125,340,250,56,'Race again (Enter)',()=>{lvl=G.next;newGame()},'#e5533d',24);
  button(W/2-90,408,180,0,'',()=>{},'#0000',1);
  btns.pop();
  btns.push({x:W/2-60,y:406,w:120,h:28,f:()=>state='menu'});
  ctx.fillStyle='#4a5a50';ctx.font='16px '+F;ctx.fillText('Main menu',W/2,420);
}
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;
  btns=[];update(dt);
  if(state==='menu')menu();else if(state==='result')result();else play();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
